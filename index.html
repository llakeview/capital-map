<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--bg2:#12121a;--card:#1a1a2e;--border:#2a2a40;--text:#e8e8e8;--text2:#999;--gold:#ffd700;--cyan:#00d4ff;--green:#00d26a;--red:#ff4757;--orange:#ff9f43}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.nav{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(15,15,26,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px;z-index:1000}
.nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.nav-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--gold),var(--orange));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.nav-logo-text{font-size:20px;font-weight:700;background:linear-gradient(90deg,var(--gold),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:8px;flex-wrap:wrap}
.nav-link{padding:8px 16px;border-radius:8px;text-decoration:none;color:var(--text2);font-size:14px;font-weight:500;transition:.2s}
.nav-link:hover{color:var(--text);background:var(--card)}
.nav-link.active{color:var(--gold);background:rgba(255,215,0,.1)}
.main{padding-top:80px}
.container{max-width:1400px;margin:0 auto;padding:0 20px 60px}
.page-header{text-align:center;padding:20px 0}
.page-title{font-size:28px;font-weight:700;margin-bottom:8px}
.page-subtitle{color:var(--text2);font-size:14px}
.data-section{margin-top:24px}
.section-title{font-size:16px;font-weight:700;margin-bottom:16px;padding-left:12px;border-left:3px solid var(--gold)}
.data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.tv-widget{border-radius:12px;overflow:hidden;height:200px;background:var(--bg2);border:1px solid var(--border)}
.data-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:.2s;position:relative}
.data-card:hover{border-color:var(--cyan);transform:translateY(-2px)}
.data-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.data-card-name{font-size:12px;color:var(--text2)}
.data-card-flag{font-size:16px}
.data-card-value{font-size:24px;font-weight:700;margin-bottom:4px}
.data-card-change{font-size:12px;font-weight:600}
.data-card-change.up{color:var(--green)}
.data-card-change.down{color:var(--red)}
.data-card-change.neutral{color:var(--text2)}
.data-card-source{font-size:9px;color:var(--text2);margin-top:8px}
.badge{position:absolute;top:8px;right:8px;padding:2px 6px;border-radius:4px;font-size:8px;font-weight:700}
.badge-live{background:rgba(0,210,106,.2);color:var(--green)}
.badge-link{background:rgba(255,159,67,.2);color:var(--orange)}
.fg-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;position:relative}
.fg-box:hover{border-color:var(--cyan)}
.fg-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.fg-title{font-size:14px;font-weight:600}
.fg-value{font-size:36px;font-weight:700}
.fg-label{font-size:12px;color:var(--text2)}
.fg-bar{height:8px;background:linear-gradient(to right,var(--red),var(--orange),var(--gold),var(--green));border-radius:4px;position:relative}
.fg-indicator{position:absolute;top:-4px;width:16px;height:16px;background:#fff;border-radius:50%;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto}
.modal-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg2);z-index:10}
.modal-title{font-size:18px;font-weight:700}
.modal-close{background:none;border:none;color:var(--text2);font-size:28px;cursor:pointer;line-height:1}
.modal-body{padding:20px}
.m-chart{width:100%;height:450px;border-radius:8px;overflow:hidden;margin-bottom:20px}
.m-section{margin-bottom:20px}
.m-section-title{font-size:13px;font-weight:700;color:var(--cyan);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.m-text{font-size:12px;color:var(--text2);line-height:1.8}
.m-list{list-style:none;font-size:12px;color:var(--text2);line-height:2.2}
.m-list li:before{content:'•';color:var(--gold);margin-right:8px}
.m-table{background:var(--card);border-radius:8px;padding:12px;font-size:11px}
.m-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}
.m-row:last-child{border:none}
.m-row.good{color:var(--green)}
.m-row.bad{color:var(--red)}
.m-row.warn{color:var(--orange)}
.m-link{display:block;margin-top:20px;padding:14px;background:var(--cyan);color:#000;text-align:center;border-radius:8px;text-decoration:none;font-weight:700}
.sources{margin-top:32px;padding:20px;background:var(--bg2);border:1px solid var(--border);border-radius:12px}
.sources-title{font-size:14px;font-weight:600;margin-bottom:12px}
.sources-list{display:flex;flex-wrap:wrap;gap:8px}
.source-tag{padding:6px 12px;background:var(--card);border-radius:6px;font-size:11px;color:var(--text2)}
.source-tag a{color:var(--cyan);text-decoration:none}
@media(max-width:768px){.nav-links{display:none}.data-grid{grid-template-columns:1fr}}
</style>
</head>

function showModal(key) {
    const info = INFO[key];
    if (!info) return;
    document.getElementById('modalTitle').textContent = info.title;
    
    let chartHtml = info.tv ? `<div class="m-chart" id="modalChart"></div>` : '';
    
    document.getElementById('modalBody').innerHTML = `
        ${chartHtml}
        <div class="m-section"><div class="m-section-title">📌 개요</div><div class="m-text">${info.desc}</div></div>
        <div class="m-section"><div class="m-section-title">📋 상세 정보</div><ul class="m-list">${info.details.map(d=>`<li>${d}</li>`).join('')}</ul></div>
        <div class="m-section"><div class="m-section-title">🔍 해석 방법</div><div class="m-table">${info.interpret.map(i=>`<div class="m-row ${i[2]}"><span>${i[0]}</span><span>${i[1]}</span></div>`).join('')}</div></div>
        <div class="m-section"><div class="m-section-title">🔗 시장 상관관계</div><div class="m-text">${info.correlation}</div></div>
        <a href="${info.url}" target="_blank" class="m-link">📊 데이터 출처로 이동 →</a>
    `;
    document.getElementById('modalOverlay').classList.add('active');
    
    if (info.tv) {
        setTimeout(() => {
            document.getElementById('modalChart').innerHTML = `<div class="tradingview-widget-container" style="height:100%;width:100%"><div id="tv_modal" style="height:100%;width:100%"></div></div>`;
            new TradingView.widget({
                container_id: "tv_modal",
                width: "100%",
                height: "100%",
                symbol: info.tv,
                interval: "D",
                timezone: "Asia/Seoul",
                theme: "dark",
                style: "1",
                locale: "kr",
                enable_publishing: false,
                hide_top_toolbar: false,
                save_image: false
            });
        }, 100);
    }
}

function closeModal(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('modalOverlay').classList.remove('active');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function fmt(n,d=2){return n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n.toLocaleString('en-US',{maximumFractionDigits:d})}

function card(key,name,flag,value,change,pct,src,live=true) {
    const cls = change>0?'up':change<0?'down':'neutral';
    const badge = live?'<span class="badge badge-live">LIVE</span>':'<span class="badge badge-link">LINK</span>';
    return `<div class="data-card" onclick="showModal('${key}')">${badge}
        <div class="data-card-header"><div class="data-card-name">${name}</div><div class="data-card-flag">${flag}</div></div>
        <div class="data-card-value">${value}</div>
        <div class="data-card-change ${cls}">${change>0?'+':''}${typeof pct==='number'?pct.toFixed(2)+'%':pct}</div>
        <div class="data-card-source">출처: ${src}</div>
    </div>`;
}

async function fetchOnchain() {
    let html = '';
    try {
        const res = await fetch('https://api.blockchain.info/charts/hash-rate?timespan=2days&format=json&cors=true');
        const data = await res.json();
        const latest = data.values[data.values.length-1];
        const prev = data.values[data.values.length-2];
        const hr = latest.y/1e6;
        const chg = ((latest.y-prev.y)/prev.y)*100;
        html += card('hashrate','해시레이트','⛏️',hr.toFixed(0)+' EH/s',chg,chg,'Blockchain.com');
    } catch(e) { html += card('hashrate','해시레이트','⛏️','클릭',0,'확인','Blockchain.com',false); }
    
    try {
        const res = await fetch('https://api.blockchain.info/charts/difficulty?timespan=30days&format=json&cors=true');
        const data = await res.json();
        const latest = data.values[data.values.length-1];
        const prev = data.values[Math.max(0,data.values.length-15)];
        const diff = latest.y/1e12;
        const chg = ((latest.y-prev.y)/prev.y)*100;
        html += card('difficulty','채굴 난이도','🔧',diff.toFixed(2)+'T',chg,chg,'Blockchain.com');
    } catch(e) { html += card('difficulty','채굴 난이도','🔧','클릭',0,'확인','Blockchain.com',false); }
    
    try {
        const res = await fetch('https://api.blockchain.info/charts/n-transactions?timespan=2days&format=json&cors=true');
        const data = await res.json();
        const latest = data.values[data.values.length-1];
        const prev = data.values[data.values.length-2];
        const chg = ((latest.y-prev.y)/prev.y)*100;
        html += card('txcount','일일 거래수','📊',fmt(latest.y,0),chg,chg,'Blockchain.com');
    } catch(e) { html += card('txcount','일일 거래수','📊','클릭',0,'확인','Blockchain.com',false); }
    
    html += `
        <div class="data-card" onclick="showModal('mvrv')"><span class="badge badge-link">LINK</span>
            <div class="data-card-header"><div class="data-card-name">MVRV Z-Score</div><div class="data-card-flag">📈</div></div>
            <div class="data-card-value" style="font-size:14px;color:var(--text2)">클릭하여 확인</div>
            <div class="data-card-source">출처: LookIntoBitcoin</div>
        </div>
        <div class="data-card" onclick="showModal('puell')"><span class="badge badge-link">LINK</span>
            <div class="data-card-header"><div class="data-card-name">Puell Multiple</div><div class="data-card-flag">💎</div></div>
            <div class="data-card-value" style="font-size:14px;color:var(--text2)">클릭하여 확인</div>
            <div class="data-card-source">출처: LookIntoBitcoin</div>
        </div>
        <div class="data-card" onclick="showModal('exchange')"><span class="badge badge-link">LINK</span>
            <div class="data-card-header"><div class="data-card-name">거래소 보유량</div><div class="data-card-flag">🏦</div></div>
            <div class="data-card-value" style="font-size:14px;color:var(--text2)">클릭하여 확인</div>
            <div class="data-card-source">출처: CoinGlass</div>
        </div>`;
    document.getElementById('onchainGrid').innerHTML = html;
}

function fetchFearGreed() {
    fetch('https://api.alternative.me/fng/').then(r=>r.json()).then(data=>{
        const v = parseInt(data.data[0].value);
        document.getElementById('fgValue').textContent = v;
        document.getElementById('fgLabel').textContent = data.data[0].value_classification;
        document.getElementById('fgIndicator').style.left = v+'%';
        document.getElementById('fgValue').style.color = v<=25?'var(--red)':v<=45?'var(--orange)':v<=55?'var(--gold)':'var(--green)';
    }).catch(e=>console.error(e));
}

fetchOnchain();
fetchFearGreed();
</script>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
