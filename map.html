const resourceTypes = {
oil:['US','CA','SA','RU','IR','IQ','KW','AE','VE','BR','NO','NG','QA','MX','MY'],
gas:['RU','IR','QA','US','SA','NO','MY'],
lithium:['AU','CL','AR','CN'],
cobalt:['CD'],
rare:['CN'],
uranium:['KZ','CA'],
copper:['CL','PE','CD','CN','MN'],
nickel:['ID','PH','RU'],
iron:['AU','BR','IN']
};

const regions = {
americas:['US','CA','MX','BR','CL','AR','VE','PE'],
emea:['NO','GB','RU','SA','AE','IR','IQ','KW','QA','ZA','CD','NG'],
apac:['CN','AU','ID','KZ','IN','JP','KR','MY','PH','MN']
};

function renderCountries(){
Object.keys(regions).forEach(r=>{
const el=document.getElementById(r);
el.innerHTML='';
regions[r].forEach(code=>{
const c=countries[code];
if(!c)return;
const div=document.createElement('div');
div.className='country';
div.dataset.code=code;
const icons=c.resources.map(r=>r.icon).join('');
div.innerHTML=`<div class="country-flag">${c.flag}</div><div class="country-name">${c.name}</div><div class="country-resources">${icons}</div>`;
div.onclick=()=>selectCountry(code);
el.appendChild(div);
});
});
}

function selectCountry(code){
document.querySelectorAll('.country').forEach(c=>c.classList.remove('active'));
document.querySelector(`.country[data-code="${code}"]`)?.classList.add('active');
const c=countries[code];
if(!c)return;
let html=`<div class="panel-country">${c.flag}</div><div class="panel-name">${c.name}</div><div class="panel-region">${c.region}</div>`;
if(c.resources.length){
html+=`<div class="resource-list">`;
c.resources.forEach(r=>{
html+=`<div class="resource-item"><div class="resource-header"><span class="resource-name">${r.icon} ${r.name}</span><span class="resource-share">${r.share}%</span></div><div class="resource-rank">세계 ${r.rank}위</div><div class="resource-bar"><div class="resource-bar-fill" style="width:${Math.min(r.share*1.5,100)}%"></div></div></div>`;
});
html+=`</div>`;
}else{
html+=`<div class="panel-note" style="border-color:var(--orange)">자원 빈국 — 수입 의존도 높음</div>`;
}
html+=`<div class="panel-note">${c.note}</div>`;
if(c.companies&&c.companies.length){
html+=`<div class="panel-companies"><div class="panel-companies-title">🏢 주요 기업</div>`;
c.companies.forEach(co=>{
html+=`<div class="company"><div class="company-name">${co.name}</div><div class="company-desc">${co.desc}</div></div>`;
});
html+=`</div>`;
}
document.getElementById('countryInfo').innerHTML=html;
}

document.querySelectorAll('.filter').forEach(btn=>{
btn.addEventListener('click',()=>{
document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
const r=btn.dataset.r;
document.querySelectorAll('.country').forEach(c=>{
c.classList.remove('has-resource');
if(r!=='all'){
const codes=resourceTypes[r]||[];
if(codes.includes(c.dataset.code))c.classList.add('has-resource');
}
});
});
});

renderCountries();
</script>
</body>
</html>
