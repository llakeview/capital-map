<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계 자원 지도 - Capital Map</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0a0a0f;--bg2:#0f0f1a;--card:#1a1a2e;--border:#252540;--text:#e0e0e0;--text2:#888;--gold:#ffd700;--cyan:#00d9ff;--green:#00d26a;--red:#ff4757;--orange:#ff9f43}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}.nav{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(15,15,26,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px;z-index:1000}.nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none}.nav-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--gold),var(--orange));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}.nav-logo-text{font-size:20px;font-weight:700;background:linear-gradient(90deg,var(--gold),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.nav-links{display:flex;gap:8px}.nav-link{padding:8px 16px;border-radius:8px;text-decoration:none;color:var(--text2);font-size:14px;font-weight:500}.nav-link:hover{color:var(--text);background:var(--card)}.nav-link.active{color:var(--gold);background:rgba(255,215,0,.1)}
.main{padding-top:80px}.container{max-width:1400px;margin:0 auto;padding:0 20px 60px}.page-header{text-align:center;padding:20px 0}.page-title{font-size:32px;font-weight:700;margin-bottom:8px}.page-subtitle{color:var(--text2);font-size:14px}
.filters{display:flex;justify-content:center;gap:8px;margin:20px 0;flex-wrap:wrap}.filter{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12px;cursor:pointer;transition:.2s}.filter:hover{border-color:var(--cyan)}.filter.active{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,.1)}
.map-container{display:flex;gap:20px;margin-top:20px}
.map-wrap{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px;min-height:500px}
.map-svg{width:100%;height:auto}
.map-svg path{fill:var(--card);stroke:var(--border);stroke-width:0.5;cursor:pointer;transition:.2s}
.map-svg path:hover{fill:var(--cyan);fill-opacity:0.3}
.map-svg path.active{fill:var(--gold);fill-opacity:0.5}
.map-svg path.has-oil{fill:#1a1a1a}.map-svg path.has-gas{fill:#2d4a3e}.map-svg path.has-lithium{fill:#1a3a4a}.map-svg path.has-copper{fill:#4a2a1a}.map-svg path.has-rare{fill:#3a1a4a}.map-svg path.has-uranium{fill:#4a4a1a}.map-svg path.has-cobalt{fill:#1a2a4a}
.panel{width:360px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px;max-height:600px;overflow-y:auto}
.panel-title{font-size:18px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.panel-country{font-size:28px;margin-bottom:4px}
.panel-name{font-size:20px;font-weight:600;margin-bottom:12px}
.resource-list{display:flex;flex-direction:column;gap:10px}
.resource-item{background:var(--card);border-radius:8px;padding:12px}
.resource-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.resource-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.resource-share{font-size:14px;font-weight:700;color:var(--gold)}
.resource-rank{font-size:11px;color:var(--text2)}
.resource-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px}
.resource-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:3px}
.panel-note{margin-top:16px;padding:12px;background:var(--card);border-radius:8px;font-size:12px;color:var(--text2);line-height:1.6;border-left:3px solid var(--cyan)}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px;padding:16px;background:var(--card);border-radius:10px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.legend-color{width:14px;height:14px;border-radius:3px}
.no-select{text-align:center;color:var(--text2);padding:40px 20px}
.no-select-icon{font-size:48px;margin-bottom:12px}
@media(max-width:900px){.map-container{flex-direction:column}.panel{width:100%}}
</style>
</head>
<body>
<nav class="nav"><a href="index.html" class="nav-logo"><div class="nav-logo-icon">💰</div><span class="nav-logo-text">CAPITAL MAP</span></a><div class="nav-links"><a href="index.html" class="nav-link">대시보드</a><a href="flow.html" class="nav-link">연결관계</a><a href="map.html" class="nav-link active">세계지도</a><a href="industry.html" class="nav-link">산업해부</a><a href="timeline.html" class="nav-link">역사</a><a href="dealers.html" class="nav-link">딜러구조</a></div></nav>
<main class="main"><div class="container">
<div class="page-header"><h1 class="page-title">🌍 세계 자원 지도</h1><p class="page-subtitle">누가 뭘 가졌나 — 자원이 지정학을 결정한다</p></div>

</svg>
<div class="legend">
<div class="legend-item"><div class="legend-color" style="background:#1a1a1a"></div>원유</div>
<div class="legend-item"><div class="legend-color" style="background:#2d4a3e"></div>천연가스</div>
<div class="legend-item"><div class="legend-color" style="background:#1a3a4a"></div>리튬</div>
<div class="legend-item"><div class="legend-color" style="background:#4a2a1a"></div>구리</div>
<div class="legend-item"><div class="legend-color" style="background:#3a1a4a"></div>희토류</div>
<div class="legend-item"><div class="legend-color" style="background:#4a4a1a"></div>우라늄</div>
<div class="legend-item"><div class="legend-color" style="background:#1a2a4a"></div>코발트</div>
<div class="legend-item"><div class="legend-color" style="background:var(--gold)"></div>선택됨</div>
</div>
</div>
<div class="panel">
<div id="countryInfo">
<div class="no-select">
<div class="no-select-icon">🗺️</div>
<p>지도에서 국가를 클릭하세요</p>
<p style="margin-top:8px;font-size:12px">자원 보유 현황을 확인할 수 있습니다</p>
</div>
</div>
</div>
</div>
</div></main>
<script>
const countryData = {
SA: {flag:"🇸🇦",name:"사우디아라비아",resources:[{name:"원유",icon:"🛢️",share:17,rank:2}],note:"OPEC 주도국. 페트로달러 체제의 핵심. 아람코 = 세계 최대 기업."},
RU: {flag:"🇷🇺",name:"러시아",resources:[{name:"천연가스",icon:"🔥",share:24,rank:1},{name:"원유",icon:"🛢️",share:6,rank:3}],note:"유럽 가스 의존도가 지정학 무기. 우크라이나 전쟁으로 에너지 지도 재편."},
CN: {flag:"🇨🇳",name:"중국",resources:[{name:"희토류",icon:"💎",share:60,rank:1},{name:"리튬 정제",icon:"🔋",share:65,rank:1}],note:"희토류 무기화 가능. 배터리 공급망 지배. 미중 갈등의 핵심."},
AU: {flag:"🇦🇺",name:"호주",resources:[{name:"리튬",icon:"🔋",share:47,rank:1},{name:"철광석",icon:"�ite", share:28,rank:1}],note:"중국 의존 탈피 시도. 서방 핵심 자원 공급국."},
CL: {flag:"🇨🇱",name:"칠레",resources:[{name:"구리",icon:"🔶",share:27,rank:1},{name:"리튬",icon:"🔋",share:22,rank:2}],note:"구리 = 경기 선행지표. 전기차 시대 핵심 국가."},
CD: {flag:"🇨🇩",name:"콩고민주공화국",resources:[{name:"코발트",icon:"⚡",share:70,rank:1}],note:"코발트 70% 독점. 아동노동 이슈, ESG 리스크."},
KZ: {flag:"🇰🇿",name:"카자흐스탄",resources:[{name:"우라늄",icon:"☢️",share:43,rank:1}],note:"세계 우라늄 43% 생산. 원전 르네상스의 핵심."},
US: {flag:"🇺🇸",name:"미국",resources:[{name:"원유",icon:"🛢️",share:15,rank:1},{name:"천연가스",icon:"🔥",share:23,rank:1}],note:"셰일혁명으로 에너지 자립. LNG 수출국 전환."},
IR: {flag:"🇮🇷",name:"이란",resources:[{name:"원유",icon:"🛢️",share:9,rank:4},{name:"천연가스",icon:"🔥",share:17,rank:2}],note:"제재로 수출 제한. 제재 해제 시 공급 급증 가능."},
QA: {flag:"🇶🇦",name:"카타르",resources:[{name:"천연가스",icon:"🔥",share:13,rank:3}],note:"LNG 수출 1위. 북부가스전 = 세계 최대 가스전."},
BR: {flag:"🇧🇷",name:"브라질",resources:[{name:"철광석",icon:"⛏️",share:17,rank:2},{name:"원유",icon:"🛢️",share:4,rank:7}],note:"프리솔트 유전. 농업 강국. 글로벌 곡물 공급."},
ZA: {flag:"🇿🇦",name:"남아공",resources:[{name:"백금",icon:"💎",share:70,rank:1},{name:"망간",icon:"⚙️",share:30,rank:1}],note:"백금족 금속 70%. 수소경제 핵심 소재."},
ID: {flag:"🇮🇩",name:"인도네시아",resources:[{name:"니켈",icon:"🔩",share:37,rank:1},{name:"주석",icon:"📦",share:30,rank:1}],note:"니켈 수출 금지로 배터리 산업 유치. 가공 의무화."},
VE: {flag:"🇻🇪",name:"베네수엘라",resources:[{name:"원유 매장량",icon:"🛢️",share:18,rank:1}],note:"매장량 세계 1위지만 생산 능력 붕괴. 제재 상태."},
CA: {flag:"🇨🇦",name:"캐나다",resources:[{name:"우라늄",icon:"☢️",share:15,rank:2},{name:"원유",icon:"🛢️",share:5,rank:4}],note:"오일샌드 매장량 막대. 미국 주요 에너지 공급국."},
NO: {flag:"🇳🇴",name:"노르웨이",resources:[{name:"천연가스",icon:"🔥",share:3,rank:7},{name:"원유",icon:"🛢️",share:2,rank:15}],note:"유럽 가스 공급 대안. 국부펀드 $1.4조."},
MX: {flag:"🇲🇽",name:"멕시코",resources:[{name:"은",icon:"🥈",share:23,rank:1},{name:"원유",icon:"🛢️",share:2,rank:12}],note:"은 생산 1위. 미국 인접 = 니어쇼어링 수혜."},
IN: {flag:"🇮🇳",name:"인도",resources:[{name:"철광석",icon:"⛏️",share:8,rank:4},{name:"석탄",icon:"ite",share:10,rank:2}],note:"인구 1위. 제조업 부상. 에너지 수요 급증."}
};

const resourceColors = {oil:'#1a1a1a',gas:'#2d4a3e',lithium:'#1a3a4a',copper:'#4a2a1a',rare:'#3a1a4a',uranium:'#4a4a1a',cobalt:'#1a2a4a'};
const resourceMap = {oil:['SA','RU','US','IR','VE','CA','BR','NO','MX','IQ','KW','AE','NG'],gas:['RU','IR','QA','US','SA','NO'],lithium:['AU','CL','CN'],cobalt:['CD'],rare:['CN'],uranium:['KZ','CA'],copper:['CL','CD','CN']};

let selectedCountry = null;

document.querySelectorAll('.filter').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const res = btn.dataset.resource;
        document.querySelectorAll('.map-svg path').forEach(p => {
            p.style.fill = '';
            p.classList.remove('has-oil','has-gas','has-lithium','has-copper','has-rare','has-uranium','has-cobalt');
        });
        if(res !== 'all') {
            const countries = resourceMap[res] || [];
            countries.forEach(code => {
                const el = document.getElementById(code);
                if(el) el.classList.add('has-' + res);
            });
        }
    });
});

document.querySelectorAll('.map-svg path').forEach(path => {
    path.addEventListener('click', () => {
        document.querySelectorAll('.map-svg path').forEach(p => p.classList.remove('active'));
        path.classList.add('active');
        const code = path.id;
        const data = countryData[code];
        const panel = document.getElementById('countryInfo');
        if(data) {
            let resourcesHtml = data.resources.map(r => `
                <div class="resource-item">
                    <div class="resource-header">
                        <span class="resource-name">${r.icon} ${r.name}</span>
                        <span class="resource-share">${r.share}%</span>
                    </div>
                    <div class="resource-rank">세계 ${r.rank}위</div>
                    <div class="resource-bar"><div class="resource-bar-fill" style="width:${r.share}%"></div></div>
                </div>
            `).join('');
            panel.innerHTML = `
                <div class="panel-country">${data.flag}</div>
                <div class="panel-name">${data.name}</div>
                <div class="resource-list">${resourcesHtml}</div>
                <div class="panel-note">${data.note}</div>
            `;
        } else {
            panel.innerHTML = `
                <div class="panel-country">🏳️</div>
                <div class="panel-name">${path.dataset.name || '정보 없음'}</div>
                <div class="panel-note">이 국가의 주요 자원 데이터가 아직 없습니다.</div>
            `;
        }
    });
});
</script>
</body>
</html>
